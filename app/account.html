<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | MARKET HUB</title><link rel="icon" href="assets/market-hub-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="account-v41.css"><link rel="stylesheet" href="storefront-v40.css?v=44-checkout-offers-1"></head><body>
<header class="account-header"><a href="index.html"><img src="assets/market-hub-logo.png" alt="MARKET HUB"></a><a href="index.html">Continue shopping</a></header>
<main>
<section id="accountApp" class="account-app"><aside class="account-sidebar"><div class="account-person"><img id="profileAvatar" src="assets/favicon.svg" alt=""><div><b id="customerName"></b><small id="customerEmail"></small></div></div><nav id="accountNav"><button data-view="dashboard">🏠 Dashboard</button><button data-view="orders">📦 My Orders</button><button data-view="tracking">🚚 Track Orders</button><a href="wishlist.html">❤ Wishlist</a><button data-view="addresses">📍 Saved Addresses</button><button data-view="wallet">💰 Wallet</button><button data-view="coupons">🎁 Coupons</button><button data-view="notifications">🔔 Notifications <span id="notificationBadge"></span></button><button data-view="returns">↩ Returns &amp; Refunds</button><button data-view="profile">👤 Profile</button><button data-view="settings">⚙ Settings</button><button id="logoutButton">🚪 Logout</button></nav></aside>
<section class="account-content">
<div id="dashboardView" class="account-view"><h1>Dashboard</h1><div id="summaryCards" class="summary-grid"></div><h2>Recent notifications</h2><div id="recentNotifications"></div></div>
<div id="ordersView" class="account-view" hidden><div class="view-heading"><h1>My Orders</h1><select id="orderFilter"><option value="">All orders</option><option value="pending">Pending</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div id="ordersList"></div></div>
<div id="trackingView" class="account-view" hidden><h1>Track Orders</h1><p class="muted">Tracking refreshes automatically while this screen is open.</p><div id="trackingList"></div></div>
<div id="addressesView" class="account-view" hidden><div class="view-heading"><h1>Saved Addresses</h1><button id="addAddressButton">Add address</button></div><div id="addressList" class="two-grid"></div><form id="addressForm" class="panel form-grid" hidden><input name="id" type="hidden"><label>Label<input name="label" value="Home"></label><label>Full name<input name="fullName" required></label><label>Phone<input name="phone" required></label><label class="wide">Address<input name="line1" required></label><label class="wide">Landmark / area<input name="line2"></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label>PIN code<input name="pincode" required></label><label><input name="isDefault" type="checkbox"> Default address</label><button>Save address</button></form></div>
<div id="walletView" class="account-view" hidden><h1>Wallet</h1><div id="walletSummary"></div><div id="walletHistory"></div></div>
<div id="couponsView" class="account-view" hidden><h1>Coupons</h1><div id="couponList" class="two-grid"></div></div>
<div id="notificationsView" class="account-view" hidden><div class="view-heading"><h1>Notifications</h1><button id="readAllButton">Mark all read</button></div><div id="notificationList"></div></div>
<div id="returnsView" class="account-view" hidden><h1>Returns &amp; Refunds</h1><div id="returnList"></div></div>
<div id="profileView" class="account-view" hidden><h1>Profile</h1><form id="profileForm" class="panel form-grid"><label>Full name<input name="fullName" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label class="wide">Profile picture HTTPS URL<input name="profileImageUrl" type="url"></label><button>Save profile</button></form></div>
<div id="settingsView" class="account-view" hidden><h1>Settings</h1><form id="passwordForm" class="panel form-grid"><label>Current password<input name="currentPassword" type="password" required></label><label>New password<input name="newPassword" type="password" minlength="8" required></label><button>Update password</button></form></div>
</section><nav class="bottom-nav"><button data-view="dashboard">🏠<small>Home</small></button><button data-view="orders">📦<small>Orders</small></button><button data-view="tracking">🚚<small>Track</small></button><a href="wishlist.html">❤<small>Wishlist</small></a><button data-menu>☰<small>More</small></button></nav></section></main><div id="accountToast"></div><script src="https://checkout-ui.shiprocket.com/assets/js/channels/shopify.js"></script><script src="storefront-v40.js?v=44-checkout-offers-1"></script><script src="account.js?v=43-product-variants-1"></script></body></html>
