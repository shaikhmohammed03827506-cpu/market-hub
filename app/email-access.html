<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email verification | MARKET HUB</title><link rel="stylesheet" href="/auth-v41-1.css"></head><body><main class="auth-page"><a class="auth-logo" href="/"><img src="/assets/market-hub-logo.png" alt="MARKET HUB"></a><section class="auth-box"><p class="eyebrow">SECURE EMAIL VERIFICATION</p><h1 id="title">Sign in with email OTP</h1><p>Use the email of your existing MARKET HUB account. New customers should create an account first.</p><p><small>Owner pilot: email verification is currently being tested. Password login remains available for everyone.</small></p><form id="requestCode"><label>Account email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><button class="primary">Send email code</button></form><form id="verifyCode" hidden><label>6-digit email code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><label id="newPasswordLabel" hidden>New password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="200"></label><button class="primary" id="verifyButton">Verify and sign in</button></form><p id="emailStatus" role="status" aria-live="polite"></p><p><a href="/login.html">Use password login</a> · <a href="/register.html">Create account</a></p></section></main><script src="/email-access.js?v=1"></script></body></html>
