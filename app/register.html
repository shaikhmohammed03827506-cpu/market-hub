<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | MARKET HUB</title><link rel="stylesheet" href="auth-v41-1.css"></head><body><main class="auth-page"><a class="auth-logo" href="/"><img src="/assets/market-hub-logo.png" alt="MARKET HUB"></a><section class="auth-box"><p class="eyebrow">JOIN MARKET HUB</p><h1>Create your account</h1><form id="customerRegisterForm" novalidate><label>Full name<input name="fullName" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone number<input name="phone" inputmode="numeric" autocomplete="tel" required></label><label>Password<span class="password-field"><input name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle>Show</button></span></label><label>Confirm password<span class="password-field"><input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle>Show</button></span></label><label class="remember"><input name="terms" type="checkbox" required> I agree to the <a href="/terms-conditions.html">Terms</a> and <a href="/privacy-policy.html">Privacy Policy</a>.</label><button class="primary">Create Account</button><p id="authError" role="alert"></p></form><p class="auth-switch">Already registered? <a href="/login.html">Login</a></p><a class="back-shop" href="/shop.html">← Back to Shop</a></section></main><script src="auth-v41-1.js"></script></body></html>
